services:
  - type: web
    name: agentshelf
    runtime: node
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_SANDBOX_BUYER_EMAIL
        sync: false
      - key: PAYPAL_SANDBOX_BUYER_PASSWORD
        sync: false
      - key: CHANNEL3_API_KEY
        sync: false
      - key: KERNEL_API_KEY
        sync: false
      - key: ASTRO_GATEWAY_API_KEY
        sync: false
      - key: JINA_API_KEY
        sync: false
      - key: ELASTIC_API_KEY
        sync: false
      - key: RENDER_API_KEY
        sync: false
      - key: VITE_AG_STUDIO_LICENSE_KEY
        sync: false
  - type: workflow
    name: agentshelf-workflows
    runtime: node
    buildCommand: npm ci && npm run build:server
    startCommand: npm run start:workflows
    envVars:
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_SANDBOX_BUYER_EMAIL
        sync: false
      - key: PAYPAL_SANDBOX_BUYER_PASSWORD
        sync: false
      - key: CHANNEL3_API_KEY
        sync: false
      - key: KERNEL_API_KEY
        sync: false
      - key: ASTRO_GATEWAY_API_KEY
        sync: false
      - key: JINA_API_KEY
        sync: false
      - key: ELASTIC_API_KEY
        sync: false
      - key: RENDER_API_KEY
        sync: false
