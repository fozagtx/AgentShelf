databases:
  - name: agentshelf-db
    plan: free
    region: oregon
    databaseName: agentshelf
    user: agentshelf

services:
  - type: web
    name: agentshelf
    runtime: node
    region: oregon
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_SANDBOX_BUYER_EMAIL
        sync: false
      - key: PAYPAL_SANDBOX_BUYER_PASSWORD
        sync: false
      - key: CHANNEL3_API_KEY
        sync: false
      - key: KERNEL_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: NEBIUS_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: agentshelf-db
          property: connectionString
      - key: RENDER_API_KEY
        sync: false
      - key: VITE_AG_STUDIO_LICENSE_KEY
        sync: false
  - type: workflow
    name: agentshelf-workflows
    runtime: node
    region: oregon
    buildCommand: npm ci && npm run build:server
    startCommand: npm run start:workflows
    envVars:
      # Secrets are set once on the web service; workflows inherit them.
      - key: PAYPAL_CLIENT_ID
        fromService:
          type: web
          name: agentshelf
          envVarKey: PAYPAL_CLIENT_ID
      - key: PAYPAL_CLIENT_SECRET
        fromService:
          type: web
          name: agentshelf
          envVarKey: PAYPAL_CLIENT_SECRET
      - key: PAYPAL_SANDBOX_BUYER_EMAIL
        fromService:
          type: web
          name: agentshelf
          envVarKey: PAYPAL_SANDBOX_BUYER_EMAIL
      - key: PAYPAL_SANDBOX_BUYER_PASSWORD
        fromService:
          type: web
          name: agentshelf
          envVarKey: PAYPAL_SANDBOX_BUYER_PASSWORD
      - key: CHANNEL3_API_KEY
        fromService:
          type: web
          name: agentshelf
          envVarKey: CHANNEL3_API_KEY
      - key: KERNEL_API_KEY
        fromService:
          type: web
          name: agentshelf
          envVarKey: KERNEL_API_KEY
      - key: OPENAI_API_KEY
        fromService:
          type: web
          name: agentshelf
          envVarKey: OPENAI_API_KEY
      - key: NEBIUS_API_KEY
        fromService:
          type: web
          name: agentshelf
          envVarKey: NEBIUS_API_KEY
      - key: RENDER_API_KEY
        fromService:
          type: web
          name: agentshelf
          envVarKey: RENDER_API_KEY
      - key: APP_HOST
        fromService:
          type: web
          name: agentshelf
          envVarKey: RENDER_EXTERNAL_HOSTNAME
      - key: DATABASE_URL
        fromDatabase:
          name: agentshelf-db
          property: connectionString
